services:
  api:
    build: .
    container_name: phone-address-api
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      APP_REDIS_HOST: redis
      APP_REDIS_PORT: 6379
      APP_REDIS_DB: 0
    depends_on:
      - redis

  redis:
    image: redis:alpine
    container_name: phone-address-redis
    command: [ "redis-server", "--appendonly", "yes" ]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  redis_data:
